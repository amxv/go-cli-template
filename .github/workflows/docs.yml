name: Docs

# Filter BEFORE requesting a Vercel deployment. Unlike Vercel's Ignored Build
# Step, a Go/Swift-only push creates no Vercel deployment and consumes no quota.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install docs dependencies
        run: bun install --frozen-lockfile
      - name: Test affected-path and deployment configuration
        run: bun run test:vercel
      - name: Validate Astro documentation
        run: bun run check

      - name: Build static output for project-scoped Vercel deployment
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.repository != 'amxv/go-cli-template'
        run: |
          set -euo pipefail
          bun run build
          node scripts/prepare-prebuilt.mjs

      # Template source projects do not own a real Vercel deployment target.
      # Generated projects deploy only with their own configured credentials.
      - name: Deploy production docs to Vercel
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.repository != 'amxv/go-cli-template'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo 'Run make vercel-provision after linking docs/ to Vercel to configure the token secret and project variables.' >&2
            exit 1
          fi
          # Project-scoped tokens can fail broad CLI project-settings queries.
          # The Build Output API bundle avoids 'vercel pull/build' entirely.
          npx --yes vercel@latest deploy --prebuilt --prod --yes --non-interactive
